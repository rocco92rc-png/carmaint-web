<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>La mia auto — Manutenzione</title>
<!-- iOS "Aggiungi a Home": si comporta come un'app a tutto schermo -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="La mia auto" />
<meta name="theme-color" content="#0f1115" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --card2: #1f2430; --text: #e8eaed;
    --muted: #9aa0ab; --line: #2a2f3a; --primary: #4f8cff; --primary-ct: #0b2140;
    --ok: #3c9a5f; --warn: #d6a21a; --bad: #e5484d; --soon: #3a7bd5; --check: #7bb0a0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  header { padding: 8px 2px 14px; }
  h1 { font-size: 1.35rem; margin: 0; }
  .sub { color: var(--muted); font-size: .9rem; margin-top: 3px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 14px; }
  .veh-name { font-size: 1.1rem; font-weight: 700; }
  .veh-meta { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .kmrow { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .kmrow input { flex: 1; min-width: 0; background: var(--card2); border: 1px solid var(--line);
    color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 1.05rem; }
  button { background: var(--primary); color: #fff; border: 0; border-radius: 12px;
    padding: 12px 16px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; }
  .section-title { font-weight: 700; margin: 18px 2px 8px; }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; }
  .item .body { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; }
  .item .detail { color: var(--muted); font-size: .88rem; margin-top: 2px; }
  .pill { display: inline-block; font-size: .72rem; padding: 2px 8px; border-radius: 999px;
    background: var(--primary-ct); color: #bcd3ff; margin-left: 6px; vertical-align: middle; }
  .muted { color: var(--muted); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px;
    background: #2a2f3a; color: #fff; padding: 11px 16px; border-radius: 12px; font-size: .9rem;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .center { text-align: center; color: var(--muted); padding: 40px 10px; }
  .check { color: var(--check); font-size: .85rem; margin-top: 3px; }
  .veh-sep { font-size: 1.05rem; font-weight: 800; margin: 20px 2px 6px; color: var(--primary);
    border-top: 1px solid var(--line); padding-top: 16px; }
  .veh-sep:first-of-type { border-top: 0; padding-top: 0; }
  .notifbar { display: flex; align-items: center; gap: 10px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  .notifbar .txt { flex: 1; min-width: 0; font-size: .92rem; }
  .notifbar .txt small { color: var(--muted); display: block; margin-top: 2px; font-size: .82rem; }
  .notifbar button { padding: 9px 14px; font-size: .9rem; }
  .notifbar.on { border-color: var(--ok); }
  .notifbar .ok { color: var(--ok); font-weight: 700; font-size: .9rem; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f3f4f6; --card:#fff; --card2:#f0f2f5; --text:#1a1c20; --muted:#5f6670;
            --line:#e3e6ea; --primary-ct:#e4edff; --check:#2f7d6a; }
  }
  .kmbox { margin-top: 10px; border-radius: 12px; }
  .kmbox .kmrow { margin-top: 0; }
  .kmbox.stale { background: #ffe08a; color: #3a2e00; padding: 10px; }
  .kmwhen { font-size: .8rem; color: var(--muted); margin-top: 6px; }
  .kmbox.stale .kmwhen { color: #3a2e00; }
  .kmwarn { font-size: .84rem; font-weight: 700; margin-top: 4px; }
  .rcpt-wrap { margin-top: 7px; }
  .rcpt { width: 128px; height: 92px; object-fit: cover; border-radius: 9px;
    border: 1px solid var(--line); cursor: zoom-in; background:#0a0c10; display:block; }
  #lightbox { position: fixed; inset: 0; z-index: 90; display: none; align-items: center;
    justify-content: center; background: rgba(0,0,0,.86); padding: 18px; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  /* --- Scheda a categorie (parti) --- */
  .scheda { margin: 2px 0 6px; display: flex; flex-direction: column; gap: 12px; }
  .statusline { display: flex; flex-wrap: wrap; gap: 14px; font-size: .82rem; font-weight: 600; }
  .mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (min-width: 480px) { .mgrid { grid-template-columns: repeat(4, 1fr); } }
  .mcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 8px; cursor: pointer; }
  .pic { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 10px;
    overflow: hidden; background: #0a0c10; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pdot { position: absolute; top: 8px; right: 8px; width: 13px; height: 13px;
    border-radius: 50%; border: 2px solid #0a0c10; }
  .mbadge { position: absolute; top: 6px; left: 6px; min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 999px; color: #fff; font-size: .75rem; font-weight: 800; line-height: 20px; text-align: center; }
  .mlab { font-size: .82rem; font-weight: 600; margin-top: 7px; line-height: 1.2; }
  .msub { font-size: .74rem; color: var(--muted); margin-top: 1px; }
  .wrench { width: 100%; height: 100%; display: flex; align-items: center;
    justify-content: center; color: #6b7280; font-size: 1.7rem; }
  #partsheet { position: fixed; inset: 0; z-index: 95; display: none; align-items: flex-end;
    justify-content: center; background: rgba(0,0,0,.6); }
  #partsheet.open { display: flex; }
  #partsheet .sheet { background: var(--card); border: 1px solid var(--line);
    border-radius: 20px 20px 0 0; width: 100%; max-width: 640px;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 86vh; overflow: auto; }
  #partsheet .ph-img { width: 100%; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden;
    background: #0a0c10; margin-bottom: 12px; }
  #partsheet .ph-img img { width: 100%; height: 100%; object-fit: cover; }
  #partsheet .ph-top { display: flex; align-items: center; gap: 10px; }
  #partsheet .ph-title { font-size: 1.15rem; font-weight: 800; flex: 1; min-width: 0; }
  #partsheet .ph-x { background: var(--card2); color: var(--text); width: 34px; height: 34px;
    border-radius: 50%; font-size: 1rem; padding: 0; }
  .ph-pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .ph-row { color: var(--muted); font-size: .9rem; margin-top: 8px; }
  #partsheet .ph-img.sm { width: 46px; height: 46px; aspect-ratio: 1 / 1; margin: 0; flex: 0 0 auto; }
  .pic.sm { width: 46px; height: 46px; flex: 0 0 auto; }
  .prows { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .prow { display: flex; gap: 10px; align-items: flex-start; padding-top: 10px; border-top: 1px solid var(--line); }
  .prow:first-child { border-top: 0; padding-top: 0; }
  .pbody { flex: 1; min-width: 0; }
  .pname { font-weight: 600; font-size: .95rem; }
  .prow-info { color: var(--muted); font-size: .84rem; margin-top: 3px; }
</style>
</head>
<body>
<div id="notifbar"></div>
<div id="app"><div class="center">Carico…</div></div>
<div id="toast" class="toast"></div>

<script>
// ---- countdown: stessa logica dell'app (prudente = recKm/recMonths se presenti) ----
const WARN_KM = 1000, WARN_DAYS = 30, HORIZON_KM = 3000, HORIZON_DAYS = 90, DAY = 86400000;
function compute(t, curKm) {
  const ik = (t.recKm ?? t.km), im = (t.recMonths ?? t.months);
  if (t.lastKm == null && t.lastDate == null) return { status: "NEVER" };
  let kmRem = null, dayRem = null;
  if (ik != null && t.lastKm != null && curKm != null) kmRem = (t.lastKm + ik) - curKm;
  if (im != null && t.lastDate != null) dayRem = Math.round(((t.lastDate + im * 30 * DAY) - Date.now()) / DAY);
  const overdue = (kmRem != null && kmRem < 0) || (dayRem != null && dayRem < 0);
  const dueSoon = !overdue && !((kmRem == null || kmRem > WARN_KM) && (dayRem == null || dayRem > WARN_DAYS));
  let status = overdue ? "OVERDUE" : (dueSoon ? "DUE_SOON" : "OK");
  return { status, kmRem, dayRem };
}
function isUpcoming(c) {
  return (c.kmRem != null && c.kmRem >= 0 && c.kmRem <= HORIZON_KM) ||
         (c.dayRem != null && c.dayRem >= 0 && c.dayRem <= HORIZON_DAYS);
}
function rank(s){ return s==="OVERDUE"?0 : s==="DUE_SOON"?1 : s==="UPCOMING"?2 : 3; }
function fmtKm(n){ return (n==null?"—":Number(n).toLocaleString("it-IT")) + " km"; }
function detailText(c) {
  if (c.kmRem != null && c.kmRem < 0) return "superato di " + fmtKm(-c.kmRem);
  if (c.kmRem != null) return "tra " + fmtKm(c.kmRem);
  if (c.dayRem != null && c.dayRem < 0) return "superato di " + (-c.dayRem) + " gg";
  if (c.dayRem != null && c.dayRem >= 45) return "tra ~" + Math.round(c.dayRem / 30) + " mesi";
  if (c.dayRem != null) return "tra " + c.dayRem + " gg";
  return "";
}
function dotColor(s){ return s==="OVERDUE"?"var(--bad)" : s==="DUE_SOON"?"var(--warn)" : s==="UPCOMING"?"var(--soon)" : "var(--ok)"; }
// Promemoria personalizzato impostato dall'officina ("ricontrolla tra… km / … mesi").
function reminderHtml(t) {
  if (t.remKm == null && t.remDate == null) return "";
  const bits = [];
  if (t.remKm != null) bits.push("a " + fmtKm(t.remKm));
  if (t.remDate != null) bits.push("entro il " + new Date(t.remDate).toLocaleDateString("it-IT"));
  let line = "⏰ Promemoria: " + bits.join(" · ");
  if (t.remNote) line += " — " + t.remNote;
  return '<div class="detail">' + esc(line) + '</div>';
}
function everyStr(km, months) {
  const parts = [];
  if (km) parts.push("ogni " + fmtKm(km));
  if (months) parts.push(months % 12 === 0
    ? "ogni " + (months/12) + (months/12 === 1 ? " anno" : " anni")
    : "ogni " + months + " mesi");
  return parts.join(" / ");
}
// ---- Ultimo inserimento km: quando e da dove (app / web / officina) ----
const KM_STALE_DAYS = 14;
const KM_SRC = { app: "app", web: "web", officina: "officina" };
function kmAge(at){ return at ? Math.max(0, Math.floor((Date.now() - at) / 86400000)) : null; }
function kmStale(at){ return !!at && (Date.now() - at) > KM_STALE_DAYS * 86400000; }
function kmInfoText(at, src){
  if (!at) return "";
  const d = new Date(at).toLocaleDateString("it-IT", { day:"numeric", month:"short", year:"numeric" });
  return "Km aggiornati il " + d + (KM_SRC[src] ? " · da " + KM_SRC[src] : "");
}
function esc(s){ return String(s ?? "").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function zoomImg(src){ var lb=document.getElementById('lightbox'); lb.querySelector('img').src=src; lb.classList.add('open'); }

// ---- Scheda a categorie: mappa manutenzione -> icona parte ----
const PART_ICONS = new Set(["alternatore","ammortizzatori","batteria","candele","candelette",
  "cinghia_servizi","clima","dischi","distribuzione","fap","filtro_abitacolo","filtro_aria",
  "filtro_carburante","filtro_olio","frizione","gomme","lavavetri","liquido_freni","luci","olio",
  "olio_cambio","pastiglie","pompa_acqua","raffreddamento","revisione","scarico","tagliando","tergicristalli"]);
// L'ordine conta: le regole piu' specifiche vanno prima.
const ICON_RULES = [
  [/filtro\s*olio/i, "filtro_olio"],
  [/olio\s*cambio|cambio\b.*\bcambio/i, "olio_cambio"],
  [/olio|lubrific/i, "olio"],
  [/candelett|preriscald/i, "candelette"],
  [/candele|bobin|accension/i, "candele"],
  [/distribuzione/i, "distribuzione"],
  [/serviz/i, "cinghia_servizi"],
  [/pompa\s*acqua/i, "pompa_acqua"],
  [/abitacolo|antipollin/i, "filtro_abitacolo"],
  [/filtro\s*aria|aria\s*motore/i, "filtro_aria"],
  [/filtro.*carburante|filtro.*gasolio|filtro.*benz|gpl/i, "filtro_carburante"],
  [/liquido.*fren|olio.*fren/i, "liquido_freni"],
  [/pastigl/i, "pastiglie"],
  [/dischi.*fren|disco.*fren|dischi\b/i, "dischi"],
  [/refriger|raffredd|radiator/i, "raffreddamento"],
  [/ammortizz|sospension|braccett|sterzo/i, "ammortizzatori"],
  [/gomm|pneumatic/i, "gomme"],
  [/batteri/i, "batteria"],
  [/clima|condizion/i, "clima"],
  [/revision/i, "revisione"],
  [/tagliand/i, "tagliando"],
  [/frizion/i, "frizione"],
  [/alternat/i, "alternatore"],
  [/scarico|marmitt|silenziat/i, "scarico"],
  [/\bfap\b|\bdpf\b|particolat/i, "fap"],
  [/tergicrist|spazzol/i, "tergicristalli"],
  [/lavavetr|lavacrist/i, "lavavetri"],
  [/luci|lampadin|faro|fanale/i, "luci"],
];
function partIconFor(t){
  const s = (t.name || "") + " " + (t.category || "");
  for (const [re, id] of ICON_RULES){ if (re.test(s) && PART_ICONS.has(id)) return id; }
  return null;
}
const WRENCH = '<div class="wrench">🔧</div>';
function grpColor(g){ return g==="bad" ? "var(--bad)" : g==="warn" ? "var(--warn)" : "var(--ok)"; }
function grpLabel(g){ return g==="bad" ? "Scaduto" : g==="warn" ? "In scadenza" : "A posto"; }

function statusGroup(st){ return st === "OVERDUE" ? "bad" : st === "DUE_SOON" ? "warn" : "ok"; }
// Icona rappresentativa di ogni sistema (categoria). null -> chiave inglese.
const CAT_ICON = {
  "Freni": "dischi", "Olio motore": "olio", "Distribuzione": "distribuzione", "Filtri": "filtro_aria",
  "Accensione": "candele", "Raffreddamento": "pompa_acqua", "Sospensioni / sterzo": "ammortizzatori",
  "Pneumatici / cerchi": "gomme", "Scarico": "scarico", "Elettrico": "batteria", "Trasmissione": "frizione",
  "Controlli periodici": "revisione", "Carrozzeria / accessori": "tergicristalli",
};
function catIcon(cat){ return CAT_ICON[cat] || null; }
function iconImg(id){ return id ? '<img src="parti/' + id + '.png" alt="" onerror="this.outerHTML=WRENCH">' : WRENCH; }
const ORD = { bad: 0, warn: 1, ok: 2 };

const SCHEDA = []; // per veicolo: { counts:{bad,warn,ok}, macros:[{cat,icon,worst,nbad,nwarn,parts:[...]}] }

function buildScheda(v, idx, cur){
  const counts = { bad: 0, warn: 0, ok: 0 };
  const byCat = {};
  (v.tasks || []).filter(t => t.enabled !== false).forEach(t => {
    const c = compute(t, cur);
    const g = statusGroup(c.status);
    counts[g]++;
    const cat = t.category || "Altro";
    (byCat[cat] = byCat[cat] || []).push({
      name: t.name, icon: partIconFor(t), g,
      detail: c.status === "NEVER" ? "mai eseguita" : (detailText(c) || ""),
      interval: everyStr(t.km, t.months),
      prudent: (t.recKm || t.recMonths) ? everyStr(t.recKm, t.recMonths) : "",
      last: (t.lastKm != null || t.lastDate != null)
        ? "ultima: " + [t.lastKm != null ? fmtKm(t.lastKm) : null,
            t.lastDate ? new Date(t.lastDate).toLocaleDateString("it-IT") : null].filter(Boolean).join(" · ")
        : "mai eseguita",
      notes: t.notes || "",
    });
  });
  const macros = Object.keys(byCat).map(cat => {
    const parts = byCat[cat].sort((a, b) => ORD[a.g] - ORD[b.g]);
    const nbad = parts.filter(p => p.g === "bad").length;
    const nwarn = parts.filter(p => p.g === "warn").length;
    const worst = nbad ? "bad" : nwarn ? "warn" : "ok";
    return { cat, icon: catIcon(cat), parts, worst, nbad, nwarn };
  }).sort((a, b) => ORD[a.worst] - ORD[b.worst] || a.cat.localeCompare(b.cat));
  SCHEDA[idx] = { counts, macros };

  let h = '<div class="scheda"><div class="statusline">' +
    '<span style="color:var(--bad)">● ' + counts.bad + ' scadut' + (counts.bad === 1 ? 'o' : 'e') + '</span>' +
    '<span style="color:var(--warn)">● ' + counts.warn + ' in scadenza</span>' +
    '<span style="color:var(--ok)">● ' + counts.ok + ' a posto</span></div><div class="mgrid">';
  macros.forEach((m, mi) => {
    const badge = m.nbad ? '<span class="mbadge" style="background:var(--bad)">' + m.nbad + '</span>'
      : m.nwarn ? '<span class="mbadge" style="background:var(--warn)">' + m.nwarn + '</span>' : '';
    h += '<div class="mcard" onclick="openSystem(' + idx + ',' + mi + ')">' +
      '<div class="pic">' + iconImg(m.icon) +
      '<span class="pdot" style="background:' + grpColor(m.worst) + '"></span>' + badge + '</div>' +
      '<div class="mlab">' + esc(m.cat) + '</div>' +
      '<div class="msub">' + m.parts.length + ' voc' + (m.parts.length === 1 ? 'e' : 'i') + '</div></div>';
  });
  return h + '</div></div>';
}

function openSystem(idx, mi){
  const m = SCHEDA[idx] && SCHEDA[idx].macros[mi];
  if (!m) return;
  const sheet = document.getElementById("partsheet");
  const rows = m.parts.map(p => {
    const info = [p.interval ? "Casa madre: " + p.interval : null,
      p.prudent ? "Consigliato: " + p.prudent : null, p.last,
      p.detail ? "Stato: " + p.detail : null, p.notes || null]
      .filter(Boolean).map(esc).join(" · ");
    return '<div class="prow"><div class="pic sm">' + iconImg(p.icon) + '</div>' +
      '<div class="pbody"><div class="pname">' + esc(p.name) +
      ' <span class="ph-pill" style="border:1px solid ' + grpColor(p.g) + ';color:' + grpColor(p.g) +
      '">' + grpLabel(p.g) + '</span></div><div class="prow-info">' + info + '</div></div></div>';
  }).join("");
  sheet.querySelector(".sheet").innerHTML =
    '<div class="ph-top"><div class="ph-img sm">' + iconImg(m.icon) + '</div>' +
    '<div class="ph-title">' + esc(m.cat) + '</div>' +
    '<button class="ph-x" onclick="closePart()">✕</button></div>' +
    '<div class="prows">' + rows + '</div>';
  sheet.classList.add("open");
}
function closePart(){ document.getElementById("partsheet").classList.remove("open"); }
// Controlli "verificato, ancora buono" del ciclo corrente (dall'ultimo intervento in poi).
function currentChecks(t) {
  const arr = Array.isArray(t.checks) ? t.checks : [];
  if (t.lastDate == null) return arr;
  return arr.filter(c => (c.date ?? Infinity) >= t.lastDate);
}
function checksHtml(t) {
  const cs = currentChecks(t);
  if (!cs.length) return "";
  return cs.map(c => {
    const when = [c.km != null ? fmtKm(c.km) : null,
                  c.date ? new Date(c.date).toLocaleDateString("it-IT") : null].filter(Boolean).join(" · ");
    const note = (c.note && String(c.note).trim()) ? " — " + esc(c.note) : "";
    return '<div class="check">✓ Verificato: ' + esc(when) + note + '</div>';
  }).join("");
}
function fmtEuro(n){ return n==null ? "" : Number(n).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; }
// Storico interventi (ricambi montati) sincronizzati dall'officina: marca/modello/prezzo.
function interventionsHtml(t) {
  const iv = Array.isArray(t.interventions) ? t.interventions : [];
  if (!iv.length) return "";
  return iv.slice()
    .sort((a,b) => (b.installedAtDate||0) - (a.installedAtDate||0))
    .map(x => {
      const head = [x.installedAtDate ? new Date(x.installedAtDate).toLocaleDateString("it-IT") : null,
                    x.installedAtKm != null ? fmtKm(x.installedAtKm) : null,
                    x.brand || null].filter(Boolean).map(esc).join(" · ");
      const sub = [x.model || null,
                   x.partCode ? "cod. " + x.partCode : null,
                   x.supplier || null,
                   x.priceEuro != null ? fmtEuro(x.priceEuro) : null,
                   x.receiptNumber ? "scontrino " + x.receiptNumber : null].filter(Boolean).map(esc).join(" · ");
      const note = (x.notes && String(x.notes).trim()) ? '<br>' + esc(x.notes) : '';
      const photo = x.photo
        ? '<div class="rcpt-wrap"><img class="rcpt" loading="lazy" alt="Scontrino" ' +
          'src="data:image/jpeg;base64,' + x.photo + '" onclick="zoomImg(this.src)"></div>'
        : '';
      return '<div class="check">🔧 ' + head + (sub ? '<br><small>' + sub + '</small>' : '') + note + photo + '</div>';
    }).join("");
}

async function loadData() {
  if (MOCK) return MOCK_DATA;
  const r = await fetch(API + "/api/client?slug=" + encodeURIComponent(SLUG));
  if (!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}

async function saveKm(km, vid) {
  if (MOCK) { return; }
  const r = await fetch(API + "/api/km", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ slug: SLUG, km, vid })
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
}

// Un blocco completo per una singola auto: card + km, prossime scadenze, storico.
function renderVehicle(v, idx) {
  let html = '<div class="card">';
  html += '<div class="veh-name">' + esc(v.name) + '</div>';
  html += '<div class="veh-meta">' + esc([v.brand, v.model, v.year].filter(Boolean).join(" ")) +
          (v.plate ? " · " + esc(v.plate) : "") + '</div>';
  const stale = kmStale(v.odoAt);
  html += '<div class="kmbox' + (stale ? ' stale' : '') + '">';
  html += '<div class="kmrow"><input id="km' + idx + '" type="number" inputmode="numeric" value="' +
          (v.odometerKm ?? "") + '" placeholder="km attuali" />' +
          '<button id="saveKm' + idx + '">Aggiorna km</button></div>';
  if (v.odoAt) html += '<div class="kmwhen">' + esc(kmInfoText(v.odoAt, v.odoSrc)) + '</div>';
  if (stale) html += '<div class="kmwarn">⚠ Non aggiorni i km da ' + kmAge(v.odoAt) +
          ' giorni: inseriscili per avere scadenze giuste.</div>';
  html += '</div></div>';

  // --- Scheda a categorie (parti): Scaduto / In scadenza / A posto ---
  const cur = v.odometerKm;
  html += buildScheda(v, idx, cur);

  // scadenze (overdue/due/upcoming) ordinate
  function soon(x){ const d = x.c.dayRem ?? 1e9, k = x.c.kmRem != null ? x.c.kmRem/30 : 1e9; return Math.min(d,k); }
  const items = (v.tasks || []).filter(t => t.enabled !== false).map(t => {
    const c = compute(t, cur);
    let st = c.status;
    if (st === "OK") st = isUpcoming(c) ? "UPCOMING" : "HIDE";
    return { t, c, st };
  }).filter(x => x.st !== "HIDE" && x.st !== "NEVER");
  items.sort((a,b) => rank(a.st)-rank(b.st) || soon(a)-soon(b));

  html += '<div class="section-title">Prossime scadenze</div>';
  if (!items.length) html += '<div class="card muted">Tutto in regola 👍</div>';
  else {
    html += '<div class="card">';
    for (const x of items) {
      html += '<div class="item"><div class="dot" style="background:' + dotColor(x.st) + '"></div>' +
        '<div class="body"><div class="name">' + esc(x.t.name) + '</div>' +
        '<div class="detail">' + esc(detailText(x.c)) + '</div>' + reminderHtml(x.t) + checksHtml(x.t) + '</div></div>';
    }
    html += '</div>';
  }

  // storico (tutte le voci con ultima esecuzione)
  html += '<div class="section-title">Tutti gli interventi</div><div class="card">';
  for (const t of (v.tasks || [])) {
    const interval = everyStr(t.km, t.months);
    const prudent = (t.recKm || t.recMonths) ? everyStr(t.recKm, t.recMonths) : null;
    const last = (t.lastKm != null || t.lastDate != null)
      ? "ultima: " + [t.lastKm != null ? fmtKm(t.lastKm) : null, t.lastDate ? new Date(t.lastDate).toLocaleDateString("it-IT") : null].filter(Boolean).join(" · ")
      : "mai eseguita";
    html += '<div class="item"><div class="body"><div class="name">' + esc(t.name) +
      (prudent ? '<span class="pill">consigliato</span>' : '') + '</div>' +
      '<div class="detail">' + (interval ? esc("Casa madre: " + interval) + ' · ' : '') +
      (prudent ? esc("consigliato: " + prudent) + ' · ' : '') + esc(last) + '</div>' +
      reminderHtml(t) + interventionsHtml(t) + checksHtml(t) + '</div></div>';
  }
  html += '</div>';
  return html;
}

function render() {
  const app = document.getElementById("app");
  if (!DATA) { app.innerHTML = '<div class="center">Nessun dato.</div>'; return; }
  const vehicles = DATA.vehicles || [];
  let html = '<header><h1>' + esc(DATA.client || "La mia auto") + '</h1>' +
    '<div class="sub">Manutenzione — aggiornato ' + new Date(DATA.updatedAt || Date.now()).toLocaleDateString("it-IT") + '</div></header>';
  if (!vehicles.length) { app.innerHTML = html + '<div class="center">Nessun veicolo.</div>'; return; }

  vehicles.forEach((v, i) => {
    // Con più auto, un titolo separa un veicolo dall'altro.
    if (vehicles.length > 1) html += '<div class="veh-sep">' + esc(v.name) + '</div>';
    html += renderVehicle(v, i);
  });

  app.innerHTML = html;
  vehicles.forEach((v, i) => {
    const btn = document.getElementById("saveKm" + i);
    if (btn) btn.onclick = () => onSaveKm(i);
  });
}

async function onSaveKm(idx) {
  const input = document.getElementById("km" + idx);
  const btn = document.getElementById("saveKm" + idx);
  const v = DATA.vehicles[idx];
  const km = parseInt(input.value, 10);
  if (isNaN(km) || km < 0) { toast("Inserisci un numero valido"); return; }
  btn.disabled = true; btn.textContent = "Salvo…";
  try {
    await saveKm(km, v.vid);
    v.odometerKm = km;
    v.odoAt = Date.now();
    v.odoSrc = "web";
    DATA.updatedAt = Date.now();
    toast("Km aggiornati ✓");
    render();
  } catch (e) {
    toast("Errore: riprova più tardi");
    btn.disabled = false; btn.textContent = "Aggiorna km";
  }
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

// ---- Promemoria push ----
let swReg = null;
function urlB64ToUint8Array(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const base = (b64 + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function pushSupported() {
  return "serviceWorker" in navigator && "PushManager" in window &&
         "Notification" in window && !!VAPID_PUBLIC;
}
// iOS consente il push solo se la pagina è stata "Aggiunta a Home" (standalone).
function iosNeedsInstall() {
  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  return iOS && !standalone;
}

async function renderNotifBar() {
  const bar = document.getElementById("notifbar");
  if (!bar) return;
  if (!pushSupported() || (!SLUG && !MOCK)) { bar.innerHTML = ""; return; }
  if (iosNeedsInstall()) {
    bar.className = "notifbar";
    bar.innerHTML = '<div class="txt">🔔 Vuoi i promemoria?<small>Su iPhone: tocca Condividi → “Aggiungi a Home”, poi apri l’icona e attiva i promemoria.</small></div>';
    return;
  }
  let sub = null;
  try { sub = swReg && (await swReg.pushManager.getSubscription()); } catch (_) {}
  if (sub && Notification.permission === "granted") {
    bar.className = "notifbar on";
    bar.innerHTML = '<div class="txt">🔔 Promemoria attivi<small>Ti avvisiamo quando c’è una scadenza.</small></div><span class="ok">✓ attivi</span>';
    return;
  }
  bar.className = "notifbar";
  bar.innerHTML = '<div class="txt">🔔 Promemoria scadenze<small>Ricevi un avviso quando una manutenzione è in scadenza.</small></div><button id="enableNotif">Attiva</button>';
  const b = document.getElementById("enableNotif");
  if (b) b.onclick = enableReminders;
}

async function enableReminders() {
  const b = document.getElementById("enableNotif");
  if (b) { b.disabled = true; b.textContent = "…"; }
  try {
    if (!swReg) swReg = await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Permesso negato"); return renderNotifBar(); }
    const sub = await swReg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC),
    });
    if (!MOCK) {
      const r = await fetch(API + "/api/subscribe", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slug: SLUG, subscription: sub.toJSON() }),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
    }
    toast("Promemoria attivati ✓");
  } catch (e) {
    toast("Impossibile attivare i promemoria");
  } finally {
    renderNotifBar();
  }
}

async function init() {
  if (!SLUG && !MOCK) {
    document.getElementById("app").innerHTML =
      '<div class="center">Link non valido: manca il codice cliente.</div>';
    return;
  }
  try { DATA = await loadData(); render(); }
  catch (e) {
    document.getElementById("app").innerHTML =
      '<div class="center">Impossibile caricare i dati.<br>Controlla il link o riprova più tardi.</div>';
  }
}
async function registerSW() {
  if (!("serviceWorker" in navigator)) return;
  try { swReg = await navigator.serviceWorker.register("sw.js"); }
  catch (_) {}
  renderNotifBar();
}
registerSW();
init();
</script>
